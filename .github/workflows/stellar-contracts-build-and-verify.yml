name: Build and Verify Stellar Contracts
on: workflow_dispatch

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  redstone-adapter:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@v22.8.1
    with:
      release_name: stellar_${{ github.sha }}
      release_description: RedStone Stellar Adapter
      package: redstone-adapter
      relative_path: packages/stellar-connector/deployments/stellarMultiFeed
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  price-feed:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@v22.8.1
    with:
      release_name: stellar_${{ github.sha }}
      release_description: RedStone Stellar Price Feed
      package: redstone-price-feed
      relative_path: packages/stellar-connector/deployments/stellarMultiFeed
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  sep-40:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@v22.8.1
    with:
      release_name: stellar_${{ github.sha }}
      release_description: RedStone Sep-40
      package: redstone-sep-40
      relative_path: packages/stellar-connector/deployments/stellarMultiFeed
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
